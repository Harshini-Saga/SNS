{% extends "base.html" %}
<title>
    {% block title %}
        Forgot Password
    {% endblock %}
</title>


<body>
{% block navmenu %}
    <a href="/login">Login</a>
    <a href="/register">Register</a>
{% endblock %}

{% block content %}
    <div>
        <h2>SNS Forgot Password</h2>
        <p>Create New Password to manage your Notes and Files</p>
        <form action="/forgot-password" method="POST">
            <div>
                <label for="email">email</label>
                <input type="email" name="email" id="">
            </div> 
            <div>
                <button type="submit">Submit</button>
            </div>
        </form>
    </div>
{% endblock %}
</body>
