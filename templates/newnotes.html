{% extends "base.html" %}

{% block title %}
   New Notes
{% endblock %}

{% block navmenu %}
    <a href="/dashboard">Home</a>
    <a href="#">Files</a>
    <a href="/dashboard/notes">Notes</a>
    <a href="#">Profile</a>
    <a href="#">Logout</a>
{% endblock %}

{% block content %}
    <div style="text-align: center;">
        <div>
            <h2>SNS-Add New Notes</h2>
        </div>
        <div>
            <p>Start Creating New Notes</p>            
        </div>
        <div>
           <form action="{{ url_for('newnotes')}}" method="POST">
                 <div>
                    <label for="title">Title</label>
                    <input type="text" name="title">
                </div>
                <div>
                    <label for="content">Content</label>
                    <textarea name="content"></textarea>
                </div>
                <div>
                    <button type="submit">Submit</button>
                </div>
           </form>
        </div>
    </div>
{% endblock %}
